name: Tienda
# Compilación lanzada tras cargar los secretos de firma (18-11-2026)

# 22-11-2026: este flujo (llave antigua de la tienda) ya NO se ejecuta solo al subir cambios, para que no
# publique una tienda con firma distinta a DonPinol. La tienda nueva sale por "Tienda DonPinol (sin firmar)".
on:
  workflow_dispatch:

permissions:
  contents: write   # publicar la APK de la tienda y actualizar catalog.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # La llave de firma vive en los secretos del repositorio, nunca en el código público.
      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.STORE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Falta el secreto STORE_KEYSTORE_B64: no se compila la tienda hasta que se configure la firma."
            echo "HAS_KEY=false" >> "$GITHUB_ENV"; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tienda.jks"
          echo "STORE_KEYSTORE_PATH=$RUNNER_TEMP/tienda.jks" >> "$GITHUB_ENV"
          echo "HAS_KEY=true" >> "$GITHUB_ENV"

      - name: Compilar la tienda y ejecutar pruebas
        if: env.HAS_KEY == 'true'
        env:
          STORE_KEYSTORE_PASSWORD: ${{ secrets.STORE_KEYSTORE_PASSWORD }}
          STORE_KEY_ALIAS: ${{ secrets.STORE_KEY_ALIAS }}
          STORE_KEY_PASSWORD: ${{ secrets.STORE_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease testReleaseUnitTest --stacktrace

      - name: Publicar resultados de pruebas
        if: always() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Publicar la tienda y anotarla en el catálogo
        if: success() && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK="UniversoPinolStore-${VERSION}.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          gh release create "tienda-v${VERSION}" "$APK" --target "$GITHUB_SHA" \
            --title "Universo Pinol Store ${VERSION}" \
            --notes "Instala esta APK una sola vez; después la tienda se actualiza sola. SHA-256: ${SHA}"
          python3 - "$VERSION" "$SHA" "$SIZE" "$APK" <<'PY'
          import json, sys, datetime
          version, sha, size, apk = sys.argv[1:]
          meses = "ene feb mar abr may jun jul ago sep oct nov dic".split()
          hoy = datetime.date.today()
          cat = json.load(open("catalog.json", encoding="utf-8"))
          entry = {
              "id": "com.universopinol.store", "name": "Universo Pinol Store",
              "tagline": "La tienda de apps de Pinol", "category": "Herramientas",
              "color": "#8B5CF6", "icon": "icons/tienda.png",
              "versionCode": int(version.split(".")[-1]), "versionName": version,
              "apkUrl": f"https://github.com/skylan2684/DonPinol-Store/releases/download/tienda-v{version}/{apk}",
              "sha256": sha, "size": int(size), "updated": f"{hoy.day} {meses[hoy.month-1]} {hoy.year}",
          }
          cat["apps"] = [a for a in cat["apps"] if a["id"] != entry["id"]] + [entry]
          cat["updatedAt"] = hoy.isoformat()
          json.dump(cat, open("catalog.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open("catalog.json", "a").write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Catálogo: Universo Pinol Store ${VERSION} [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
